name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

jobs:
  lint:
    name: Format, Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dev dependencies
        run: pip install -r requirements.dev.txt
      - name: Format check (black)
        run: black --check app
      - name: Lint (flake8)
        run: flake8 app --select=E9,F63,F7,F82,E501 --max-line-length=88
      - name: Type check (mypy)
        run: mypy app

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: collabnote
          POSTGRES_PASSWORD: collabnote
          POSTGRES_DB: collabnote_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://collabnote:collabnote@localhost:5432/collabnote_test
      REDIS_URL: redis://localhost:6379/0
      MONGODB_URL: mongodb://localhost:27017
      MONGODB_DB_NAME: collabnote_test
      SECRET_KEY: ci-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dev dependencies
        run: pip install -r requirements.dev.txt
      - name: Run migrations
        run: alembic upgrade head
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=60

